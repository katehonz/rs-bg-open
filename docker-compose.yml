version: '3.8'

services:
  # PostgreSQL База данни
  db:
    image: postgres:15-alpine
    container_name: accounting_db
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=bg_BG.UTF-8 --lc-ctype=bg_BG.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port not exposed externally - only accessible via Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d accounting"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      accounting_network:
        ipv4_address: 172.20.0.10

  # Redis за caching и sessions
  redis:
    image: redis:7-alpine
    container_name: accounting_redis
    # Port not exposed externally - only accessible via Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      accounting_network:
        ipv4_address: 172.20.0.11

  # Главен счетоводен сервиз (Rust Backend)
  accounting-service:
    build:
      context: .
      dockerfile: Dockerfile.accounting
    container_name: accounting_service
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-change_me_in_production}@db:5432/accounting
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      HOST: 0.0.0.0
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_in_production}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      accounting_network:
        ipv4_address: 172.20.0.20

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accounting_frontend
    environment:
      # За localhost development
      REACT_APP_API_BASE_URL: http://localhost
      REACT_APP_DOMAIN: localhost
    expose:
      - "3000"
    depends_on:
      - accounting-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      accounting_network:
        ipv4_address: 172.20.0.30

  # NOTE: Nginx заменен с Caddy reverse proxy
  # Caddy се управлява от външен контейнер

volumes:
  postgres_data:
    driver: local

networks:
  accounting_network:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
